services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pursuitnova
      POSTGRES_USER: pursuitnova
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-pursuitnova-only}
    volumes:
      - pursuitnova_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pursuitnova -d pursuitnova"]
      interval: 5s
      timeout: 3s
      retries: 20
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://pursuitnova:${POSTGRES_PASSWORD:-local-pursuitnova-only}@db:5432/pursuitnova
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-before-production-2026}
      COOKIE_SECURE: "false"
      COOKIE_SAMESITE: lax
      SEED_DEMO: "true"
      AUTO_CREATE_SCHEMA: "false"
      CORS_ORIGINS: http://localhost:8000
    depends_on:
      db:
        condition: service_healthy
volumes:
  pursuitnova_pg:
